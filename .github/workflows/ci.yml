name: Workspace checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bootstrap_test
          POSTGRES_PASSWORD: bootstrap_test
          POSTGRES_DB: bootstrap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bootstrap_test -d bootstrap_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          BOOTSTRAP_TEST_DATABASE_URL: postgresql://bootstrap_test:bootstrap_test@127.0.0.1:5432/bootstrap_test
          BOOTSTRAP_TEST_BUILT_WORKER: "true"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: workspace-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
